<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaloCoach phone preview</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 32px; color: #193326; background: radial-gradient(circle at 50% 0%, #e6f2e5, #f5f7f3 56%, #e9f0e9); }
      .preview-copy { width: min(290px, 100%); }
      .preview-copy .eyebrow { color: #699270; font-size: 10px; font-weight: 800; letter-spacing: .16em; }
      .preview-copy h1 { margin: 10px 0 9px; font-size: 30px; letter-spacing: -.06em; line-height: 1.08; }
      .preview-copy p { color: #678071; font-size: 13px; line-height: 1.55; margin: 0; }
      .preview-copy .hint { display: flex; align-items: center; gap: 8px; margin-top: 22px; color: #557662; font-size: 11px; font-weight: 700; }
      .hint span { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #24543c; background: #c9ed7b; }
      .phone { width: 390px; height: 844px; position: relative; overflow: hidden; border: 8px solid #193326; border-radius: 45px; background: #f6f8f5; box-shadow: 0 28px 70px rgba(35, 75, 48, .24), 0 3px 0 #50725b; }
      .phone:before { content: ""; position: absolute; z-index: 3; top: 0; left: 50%; width: 116px; height: 25px; border-radius: 0 0 18px 18px; background: #193326; transform: translateX(-50%); pointer-events: none; }
      iframe { width: 100%; height: 100%; border: 0; background: #f6f8f5; }
      @media (max-width: 760px) {
        body { align-items: flex-start; flex-direction: column; gap: 22px; padding: 20px 14px 30px; }
        .preview-copy { width: 100%; text-align: center; }
        .preview-copy h1 { font-size: 25px; }
        .preview-copy .hint { justify-content: center; }
        .phone { align-self: center; width: min(390px, calc(100vw - 28px)); height: min(844px, calc(100vh - 185px)); min-height: 630px; border-width: 6px; border-radius: 34px; }
      }
    </style>
  </head>
  <body>
    <section class="preview-copy">
      <div class="eyebrow">PHONE PREVIEW</div>
      <h1>CaloCoach, in your pocket.</h1>
      <p>Try the actual responsive app inside a phone-sized viewport. Tap through Home, Diary, Coach, and Progress to see the one-hand experience.</p>
      <div class="hint"><span>↕</span> Scroll inside the phone to explore</div>
    </section>
    <div class="phone" aria-label="CaloCoach phone preview">
      <iframe title="CaloCoach phone preview" src="./index.html?phone-preview=1"></iframe>
    </div>
  </body>
</html>
